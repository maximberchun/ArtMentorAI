# fly.toml app configuration file generated for artmentorai-api on 2026-05-07T15:12:35+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'artmentorai-api'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG = 'false'
  EMBEDDING_CACHE_FOLDER = '/opt/embeddings_cache'
  ENVIRONMENT = 'production'
  ALLOWED_ORIGINS = '["https://artmentorai.com"]'
  SERVER__HOST = '0.0.0.0'
  SERVER__PORT = '8000'
  SUPABASE__OAUTH_REDIRECT_URL = 'https://artmentorai.com/sign-in'
  # Qdrant Cloud endpoint can be set via secret QDRANT_URL (preferred),
  # or via QDRANT_HOST/QDRANT_PORT for host+port connections.
  QDRANT_PORT = '6333'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 12
    hard_limit = 16

  [[http_service.checks]]
    interval = '10s'
    timeout = '15s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
