name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    env:
      BACKEND_COVERAGE_MIN: "35"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        run: uv sync --extra test

      - name: Run backend tests
        run: uv run pytest --cov-fail-under=${BACKEND_COVERAGE_MIN}

  frontend-tests:
    name: Frontend vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

  backend-coverage-report:
    name: Backend coverage report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Keep report job aligned with the phased backend gate.
      BACKEND_COVERAGE_MIN: "35"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        run: uv sync --extra test

      - name: Run backend tests with default coverage gate
        run: uv run pytest --cov-fail-under=${BACKEND_COVERAGE_MIN}

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-artifacts
          path: |
            reports/coverage.lcov
            reports/coverage_html_report
            reports/junit/tests.xml
          if-no-files-found: warn
