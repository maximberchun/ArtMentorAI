name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --extra test

      - name: Run backend tests
        run: uv run pytest --cov-fail-under=0

  frontend-tests:
    name: Frontend vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

  backend-coverage-report:
    name: Backend coverage report (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install backend dependencies
        run: uv sync --extra test

      - name: Run backend tests with default coverage gate
        run: uv run pytest

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-artifacts
          path: |
            reports/coverage.lcov
            reports/coverage_html_report
            reports/junit/tests.xml
          if-no-files-found: warn
